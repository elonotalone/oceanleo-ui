<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>W10 hosted local origin host</title>
    <link rel="stylesheet" href="/r2-chrome.css" />
  </head>
  <body>
    <div class="bar">
      <span data-testid="hosted-status">waiting</span>
      <button type="button" data-testid="hosted-save">保存</button>
      <button type="button" data-testid="hosted-export">导出</button>
    </div>
    <iframe
      id="hosted-frame"
      data-testid="hosted-frame"
      sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads allow-modals"
      style="width: 100%; height: calc(100vh - 48px); border: 0; background: #fff"
    ></iframe>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const src = params.get("src") || "";
      const instanceId = params.get("instance") || "r2-hosted";
      const PROTOCOL = "oceanleo.editor.v1";
      const outbound = [];
      const status = document.querySelector("[data-testid=hosted-status]");
      const frame = document.getElementById("hosted-frame");
      window.__oceanleoOutbound = outbound;
      window.__oceanleoHostOrigin = location.origin;

      function postToFrame(message) {
        const target = new URL(src).origin;
        frame.contentWindow?.postMessage(
          { protocol: PROTOCOL, instanceId, ...message },
          target,
        );
      }

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || data.protocol !== PROTOCOL) return;
        outbound.push(data);
        if (data.type) status.textContent = data.type;
        if (data.type === "ready") {
          window.__oceanleoReady = true;
        }
        if (data.type === "recovery-snapshot") {
          window.__oceanleoSnapshot = data;
        }
      });

      document.querySelector("[data-testid=hosted-save]").onclick = () => {
        postToFrame({ type: "save-request", saveId: "save-1" });
      };
      document.querySelector("[data-testid=hosted-export]").onclick = () => {
        postToFrame({ type: "recovery-capture", recoveryId: "export-1" });
      };

      window.__oceanleoHost = {
        postToFrame,
        outbound,
      };

      if (src) {
        const url = new URL(src);
        url.searchParams.set("embed", "1");
        url.searchParams.set("editor", "1");
        url.searchParams.set("instance", instanceId);
        url.searchParams.set("host", location.origin);
        frame.src = url.toString();
      }
    </script>
  </body>
</html>
